<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oasiz SDK Atlas Test Game</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #151719;
        color: #f4f0e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background:
          linear-gradient(#22262a 1px, transparent 1px),
          linear-gradient(90deg, #22262a 1px, transparent 1px),
          #151719;
        background-size: 24px 24px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #343a40;
        background: rgba(21, 23, 25, 0.92);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .status {
        min-width: 0;
        margin-top: 4px;
        color: #b8c0c7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button,
      select {
        height: 34px;
        border: 1px solid #4c555d;
        border-radius: 6px;
        background: #24282c;
        color: #f4f0e8;
        font: inherit;
        font-size: 13px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      button:hover,
      select:hover {
        border-color: #d7a64a;
      }

      select {
        max-width: min(44vw, 260px);
        padding: 0 28px 0 10px;
      }

      main {
        position: relative;
        min-height: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        left: 16px;
        bottom: 16px;
        width: min(420px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid #3d444b;
        border-radius: 8px;
        background: rgba(21, 23, 25, 0.88);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      }

      .hud dl {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 6px 12px;
        margin: 0;
      }

      .hud dt {
        color: #9da7ae;
        font-size: 12px;
      }

      .hud dd {
        min-width: 0;
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keys {
        margin-top: 10px;
        color: #b8c0c7;
        font-size: 12px;
      }

      @media (max-width: 680px) {
        header {
          grid-template-columns: 1fr;
        }

        .actions {
          justify-content: stretch;
        }

        button,
        select {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Oasiz SDK Atlas Test Game</h1>
        <div id="status" class="status">Loading SDK atlas...</div>
      </div>
      <div class="actions">
        <select id="animationSelect" aria-label="Preview animation">
          <option value="">Auto animation</option>
        </select>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </header>

    <main>
      <canvas id="game" aria-label="Atlas animation test canvas"></canvas>
      <section class="hud" aria-label="Atlas debug details">
        <dl>
          <dt>Character</dt>
          <dd id="characterName">-</dd>
          <dt>Animation</dt>
          <dd id="animationId">-</dd>
          <dt>Frame</dt>
          <dd id="frameName">-</dd>
          <dt>Atlas</dt>
          <dd id="atlasUrl">-</dd>
        </dl>
        <div class="keys">Move with WASD or arrow keys. Pick an animation to preview exact atlas IDs.</div>
      </section>
    </main>

    <script type="module">
      import {
        getJibbleAnimationId,
        getSamplePlayerCharacter,
        oasiz,
      } from "../dist/index.js";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const statusEl = document.querySelector("#status");
      const characterNameEl = document.querySelector("#characterName");
      const animationIdEl = document.querySelector("#animationId");
      const frameNameEl = document.querySelector("#frameName");
      const atlasUrlEl = document.querySelector("#atlasUrl");
      const animationSelect = document.querySelector("#animationSelect");
      const resetButton = document.querySelector("#resetButton");

      const keys = new Set();
      const state = {
        character: null,
        atlas: null,
        image: null,
        framesByName: new Map(),
        animationsById: new Map(),
        x: 0,
        y: 0,
        direction: "front",
        selectedAnimationId: "",
        lastTime: performance.now(),
      };

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * ratio));
        canvas.height = Math.max(1, Math.floor(rect.height * ratio));
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("Atlas image failed to load"));
          image.src = src;
        });
      }

      async function loadCharacterImage(character) {
        const atlas = character.textureAtlas;
        return {
          character,
          atlas,
          image: await loadImage(atlas.imageUrl),
        };
      }

      async function loadAtlas() {
        setStatus("Requesting player character atlas...");
        const character =
          (await oasiz.getPlayerCharacter({
            localFallback: true,
            sampleFetchTimeoutMs: 2500,
          })) ?? getSamplePlayerCharacter();

        try {
          return await loadCharacterImage(character);
        } catch (error) {
          console.warn("[atlas-game] Platform atlas image failed; using SDK SVG sample.", error);
          setStatus("Atlas image failed. Using bundled SDK SVG sample.");
          return loadCharacterImage(getSamplePlayerCharacter());
        }
      }

      function installAtlas({ character, atlas, image }) {
        state.character = character;
        state.atlas = atlas;
        state.image = image;
        state.framesByName = new Map(atlas.frames.map((frame) => [frame.name, frame]));
        state.animationsById = new Map(
          atlas.animations.map((animation) => [animation.animationId, animation]),
        );

        animationSelect.replaceChildren(new Option("Auto animation", ""));
        for (const animation of atlas.animations) {
          animationSelect.append(new Option(animation.animationId, animation.animationId));
        }

        characterNameEl.textContent = character.characterName ?? character.baseCharacterId;
        atlasUrlEl.textContent = atlas.imageUrl;
        setStatus(`Loaded ${atlas.animations.length} animations from ${character.baseCharacterId}.`);
      }

      function resetPlayer() {
        const rect = canvas.getBoundingClientRect();
        state.x = rect.width / 2;
        state.y = rect.height / 2;
        state.direction = "front";
      }

      function getDirectionFromInput(dx, dy) {
        if (dy < 0 && dx < 0) return "back-left";
        if (dy < 0 && dx > 0) return "back-right";
        if (dy > 0 && dx < 0) return "front-left";
        if (dy > 0 && dx > 0) return "front-right";
        if (dy < 0) return "back";
        if (dy > 0) return "front";
        if (dx < 0) return "left";
        if (dx > 0) return "right";
        return state.direction;
      }

      function getInputVector() {
        let dx = 0;
        let dy = 0;
        if (keys.has("ArrowLeft") || keys.has("a")) dx -= 1;
        if (keys.has("ArrowRight") || keys.has("d")) dx += 1;
        if (keys.has("ArrowUp") || keys.has("w")) dy -= 1;
        if (keys.has("ArrowDown") || keys.has("s")) dy += 1;
        return { dx, dy };
      }

      function pickAnimation(isMoving) {
        if (state.selectedAnimationId) {
          return (
            state.animationsById.get(state.selectedAnimationId) ??
            state.animationsById.values().next().value
          );
        }

        const requestedId = getJibbleAnimationId(
          isMoving ? "walk" : "idle",
          state.direction,
        );
        return (
          state.animationsById.get(requestedId) ??
          state.animationsById.get("idle_s") ??
          state.animationsById.values().next().value
        );
      }

      function drawWorld(width, height) {
        ctx.fillStyle = "#151719";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "#242a30";
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y < height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      function drawPlayer(animation, now) {
        if (!state.image || !animation || animation.frames.length === 0) return;

        const frameRate = Math.max(1, animation.frameRate || 8);
        const frameIndex = Math.floor((now / 1000) * frameRate) % animation.frames.length;
        const frameName = animation.frames[frameIndex];
        const frame = state.framesByName.get(frameName);
        if (!frame) return;

        const maxDrawHeight = 132;
        const scale = Math.min(4, maxDrawHeight / frame.height);
        const drawWidth = frame.width * scale;
        const drawHeight = frame.height * scale;
        const drawX = state.x - drawWidth / 2;
        const drawY = state.y - drawHeight + 8;

        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.beginPath();
        ctx.ellipse(state.x, state.y + 10, drawWidth * 0.32, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          state.image,
          frame.x,
          frame.y,
          frame.width,
          frame.height,
          drawX,
          drawY,
          drawWidth,
          drawHeight,
        );

        animationIdEl.textContent = animation.animationId;
        frameNameEl.textContent = frameName;
      }

      function tick(now) {
        const rect = canvas.getBoundingClientRect();
        const dt = Math.min(0.05, (now - state.lastTime) / 1000);
        state.lastTime = now;

        const { dx, dy } = getInputVector();
        const isMoving = dx !== 0 || dy !== 0;
        if (isMoving) {
          const length = Math.hypot(dx, dy) || 1;
          state.direction = getDirectionFromInput(dx, dy);
          state.x += (dx / length) * 168 * dt;
          state.y += (dy / length) * 168 * dt;
          state.x = Math.max(44, Math.min(rect.width - 44, state.x));
          state.y = Math.max(70, Math.min(rect.height - 28, state.y));
        }

        drawWorld(rect.width, rect.height);
        drawPlayer(pickAnimation(isMoving), now);
        requestAnimationFrame(tick);
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        resetPlayer();
      });

      window.addEventListener("keydown", (event) => {
        keys.add(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });

      animationSelect.addEventListener("change", () => {
        state.selectedAnimationId = animationSelect.value;
      });

      resetButton.addEventListener("click", resetPlayer);

      resizeCanvas();
      resetPlayer();
      installAtlas(await loadAtlas());
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
