name: SDK Release

on:
  workflow_run:
    workflows: ["SDK Tests"]
    branches: ["main"]
    types:
      - completed

permissions:
  contents: read

jobs:
  npm:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Release JS SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@oasiz"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm publish identity
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is not configured for this workflow." >&2
            exit 1
          fi

          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          echo "npm registry: $(npm config get registry)"
          echo "npm userconfig: $(npm config get userconfig)"
          echo "If NPM_TOKEN was updated after this workflow run was created, queue a new run instead of rerunning this one."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish JS SDK to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-workspace.mjs packages/sdk

  unity-r2:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Release Unity SDK to R2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Verify R2 publish config
        shell: bash
        env:
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CUSTOM_DOMAIN: ${{ secrets.R2_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail

          for name in R2_BUCKET_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_CUSTOM_DOMAIN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured for this workflow." >&2
              exit 1
            fi
          done

          echo "R2 custom domain: $R2_CUSTOM_DOMAIN"

      - name: Upload Unity SDK to R2
        env:
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CUSTOM_DOMAIN: ${{ secrets.R2_CUSTOM_DOMAIN }}
        run: bun run scripts/upload-unity-sdk.ts ./packages/OasizSDK
