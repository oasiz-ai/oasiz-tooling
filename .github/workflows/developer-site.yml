name: Developer Site

on:
  pull_request:
    branches: ["**"]
    paths:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-site.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify developer site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck developer site
        run: npx tsc -p apps/site/tsconfig.json --noEmit

      - name: Build developer site
        run: npm run developers:build

      - name: Validate Worker deploy
        run: npx wrangler deploy --dry-run
        working-directory: apps/site

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Deploy developer site
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run developers:edge:deploy
